<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solicita tu cotización — Spazio Luce</title>
<meta name="description" content="Cuéntanos de tu proyecto y te contactamos para cotizar sin compromiso. Ingeniería, interiorismo, obra e iluminación en Naucalpan, Estado de México.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A0A0A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230A0A0A'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' font-weight='700' fill='%23C9A227' text-anchor='middle'%3ESL%3C/text%3E%3C/svg%3E">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --gold:#C9A227;--gold-bright:#E4B84A;--bg:#0A0A0A;--bg-soft:#0F0F0E;
    --surface:#151513;--text:#F4F0E6;--muted:#9A9280;--line:rgba(201,162,39,0.18);
    --ease-out:cubic-bezier(0.23,1,0.32,1);
  }
  html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
  body{
    background:var(--bg);color:var(--text);font-family:'Montserrat',system-ui,sans-serif;
    font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100svh;
    display:flex;flex-direction:column;
  }
  a,button,label{touch-action:manipulation}
  a{color:var(--gold);text-decoration:none;transition:color 160ms ease}
  @media (hover:hover) and (pointer:fine){a:hover{color:var(--gold-bright)}}
  h1{font-family:'Playfair Display',Georgia,serif;font-weight:700;line-height:1.15;text-wrap:balance}
  p{text-wrap:pretty}

  /* motion */
  @keyframes pop{from{opacity:0;translate:0 10px}to{opacity:1;translate:0 0}}
  @keyframes checkIn{from{opacity:0;scale:.85}to{opacity:1;scale:1}}
  :focus-visible{outline:2px solid var(--gold-bright);outline-offset:3px}

  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:20px clamp(18px,5vw,48px);border-bottom:1px solid var(--line);
  }
  .brand{display:flex;flex-direction:column;line-height:1}
  .brand b{font-family:'Playfair Display',serif;font-size:17px;font-weight:700;letter-spacing:.16em;color:var(--text)}
  .brand span{font-size:8px;letter-spacing:.3em;color:var(--gold);margin-top:4px;font-weight:600}
  .back{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}

  main{flex:1;display:flex;justify-content:center;padding:clamp(28px,6vw,64px) clamp(18px,5vw,48px)}
  .card{width:100%;max-width:560px}

  .eyebrow{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);font-weight:600;display:inline-flex;align-items:center;gap:12px}
  .eyebrow::before{content:"";width:24px;height:1px;background:var(--gold)}
  h1{font-size:clamp(26px,5vw,36px);margin:16px 0 12px}
  .lede{color:var(--muted);font-size:14px;margin-bottom:32px;max-width:46ch}

  form{display:grid;gap:18px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .field{display:flex;flex-direction:column;gap:7px}
  .field label{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .field label .opt{color:var(--muted);letter-spacing:.05em}
  /* 16px minimum: anything smaller makes iOS Safari zoom the whole page when a field is focused */
  input,select,textarea{
    background:var(--bg-soft);border:1px solid var(--line);color:var(--text);
    padding:12px 14px;font-family:inherit;font-size:16px;width:100%;border-radius:0;
    transition:border-color 160ms ease;
  }
  textarea{min-height:110px;resize:vertical}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}

  .check-grid{display:flex;flex-wrap:wrap;gap:8px}
  .check-pill{
    display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;
    padding:8px 14px;font-size:13px;cursor:pointer;user-select:none;-webkit-user-select:none;background:var(--bg-soft);color:var(--muted);
    transition:border-color 160ms ease,color 160ms ease,background-color 160ms ease,transform 160ms var(--ease-out);
  }
  .check-pill:active{transform:scale(.97)}
  .check-pill input{margin:0;width:auto;accent-color:var(--gold)}
  .check-pill.checked{border-color:var(--gold);color:var(--text);background:rgba(201,162,39,.08)}

  .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}

  button.submit{
    justify-self:start;background:var(--gold);color:#0A0A0A;border:0;
    font-family:'Montserrat',sans-serif;font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;font-weight:600;
    padding:15px 34px;cursor:pointer;
    transition:background-color 160ms ease,opacity 160ms ease,transform 160ms var(--ease-out);
  }
  button.submit:active:not(:disabled){transform:scale(.97)}
  @media (hover:hover) and (pointer:fine){button.submit:hover:not(:disabled){background:var(--gold-bright)}}
  button.submit:disabled{opacity:.6;cursor:default}

  .msg{font-size:13px;padding:12px 15px;border:1px solid var(--line)}
  .msg:not([hidden]){animation:pop 260ms var(--ease-out) both}
  .msg.err{border-color:#9a5a45;color:#dca08d}

  /* the page settles in once on load; the thank-you state gets its own small moment */
  .card > :not(.done){animation:pop 560ms var(--ease-out) both}
  .card > :nth-child(1){animation-delay:60ms}
  .card > :nth-child(2){animation-delay:120ms}
  .card > :nth-child(3){animation-delay:180ms}
  .card > :nth-child(4){animation-delay:240ms}

  .done{text-align:left;padding:8px 0}
  .done .check{
    width:48px;height:48px;border:2px solid var(--gold);border-radius:999px;display:flex;align-items:center;justify-content:center;
    color:var(--gold);font-size:24px;margin-bottom:20px;animation:checkIn 420ms var(--ease-out) both;
  }
  .done h2{font-family:'Playfair Display',serif;font-size:26px;font-weight:600;margin-bottom:10px;text-wrap:balance;animation:pop 420ms var(--ease-out) 90ms both}
  .done p{color:var(--muted);font-size:14px;margin-bottom:24px;max-width:42ch;animation:pop 420ms var(--ease-out) 160ms both}
  .done .alt{font-size:13px;color:var(--muted)}

  footer{padding:20px clamp(18px,5vw,48px);border-top:1px solid var(--line);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}

  @media (max-width:520px){ .grid2{grid-template-columns:1fr} }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important}
    .card > :not(.done),.msg,.done .check,.done h2,.done p{animation:none}
  }
</style>
</head>
<body>
<header class="topbar">
  <a href="../" class="brand" aria-label="Spazio Luce">
    <b>SPAZIO&nbsp;LUCE</b>
    <span>Ingeniería · Proyectos · Obras</span>
  </a>
  <a href="../" class="back">← Volver al sitio</a>
</header>

<main>
  <div class="card" id="card">
    <p class="eyebrow">Cotización</p>
    <h1>Cuéntanos de tu proyecto</h1>
    <p class="lede">Llena estos datos y te contactamos para cotizar sin compromiso. Si prefieres, también puedes escribirnos directo por <a href="https://wa.me/525651634053" target="_blank" rel="noopener">WhatsApp</a>.</p>

    <form id="form" novalidate>
      <div class="grid2">
        <div class="field">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" maxlength="80" required autocomplete="name">
        </div>
        <div class="field">
          <label for="telefono">Teléfono</label>
          <input type="tel" id="telefono" maxlength="20" required autocomplete="tel" placeholder="55 1234 5678">
        </div>
      </div>
      <div class="grid2">
        <div class="field">
          <label for="email">Email <span class="opt">(opcional)</span></label>
          <input type="email" id="email" maxlength="120" autocomplete="email">
        </div>
        <div class="field">
          <label for="tipo">Tipo de proyecto</label>
          <select id="tipo">
            <option value="Residencial">Residencial</option>
            <option value="Comercial">Comercial</option>
            <option value="Industrial">Industrial</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>¿Qué te interesa?</label>
        <div class="check-grid" id="lineas"></div>
      </div>
      <div class="field">
        <label for="proyecto">Proyecto o ubicación <span class="opt">(opcional)</span></label>
        <input type="text" id="proyecto" maxlength="120" placeholder="Ej. Casa en Naucalpan, remodelación de sala">
      </div>
      <div class="field">
        <label for="mensaje">Cuéntanos más <span class="opt">(opcional)</span></label>
        <textarea id="mensaje" maxlength="600" placeholder="¿Qué tienes en mente? Metros, fechas, presupuesto aproximado…"></textarea>
      </div>
      <input type="text" class="hp" id="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button type="submit" class="submit" id="submit">Solicitar cotización</button>
      <p class="msg err" id="msg" hidden></p>
    </form>
  </div>
</main>

<footer>Spazio Luce · Naucalpan, Estado de México</footer>

<script>
(function(){
  "use strict";
  var SB_URL = 'https://smjktuithhvfmexysvkf.supabase.co';
  var SB_KEY = 'sb_publishable_h7YxlJXIADT1827fFx6hyg_jtjmnmGZ';
  var $ = function(id){ return document.getElementById(id); };
  var LINEAS = ["Obra","Interiorismo","Iluminación","Herrería y carpintería"];

  var wrap = $('lineas');
  LINEAS.forEach(function(ln){
    var label = document.createElement('label');
    label.className = 'check-pill';
    var input = document.createElement('input');
    input.type = 'checkbox'; input.value = ln;
    label.appendChild(input);
    label.appendChild(document.createTextNode(ln));
    label.addEventListener('click', function(){
      setTimeout(function(){ label.classList.toggle('checked', input.checked); }, 0);
    });
    wrap.appendChild(label);
  });

  $('form').addEventListener('submit', function(e){
    e.preventDefault();
    var msg = $('msg'), btn = $('submit');
    var fail = function(text){ msg.textContent = text; msg.hidden = false; };
    msg.hidden = true;

    if($('hp').value) return;
    var nombre = $('nombre').value.trim();
    var telefono = $('telefono').value.trim();
    if(nombre.length < 2){ fail('Escribe tu nombre.'); $('nombre').focus(); return; }
    if(telefono.replace(/\D/g,'').length < 10){ fail('Escribe un teléfono a 10 dígitos para poder contactarte.'); $('telefono').focus(); return; }

    var lineas = [].filter.call(wrap.querySelectorAll('input[type=checkbox]'), function(c){ return c.checked; })
      .map(function(c){ return c.value; });
    var mensaje = $('mensaje').value.trim();
    var proyecto = $('proyecto').value.trim();

    btn.disabled = true; btn.textContent = 'Enviando…';
    fetch(SB_URL + '/rest/v1/crm_leads', {
      method: 'POST',
      headers: { apikey: SB_KEY, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
      body: JSON.stringify({
        nombre: nombre,
        telefono: telefono,
        email: $('email').value.trim() || null,
        tipo: $('tipo').value,
        lineas: lineas,
        empresa: proyecto || null,
        fuente: 'Sitio web',
        etapa: 'nuevo',
        valor: 0,
        notas: mensaje ? [{ fecha: new Date().toISOString(), texto: mensaje }] : []
      })
    })
    .then(function(r){
      if(r.ok || r.status === 201){
        $('card').innerHTML =
          '<div class="done">' +
            '<div class="check" aria-hidden="true">✓</div>' +
            '<h2>¡Gracias, ' + nombre.split(' ')[0] + '!</h2>' +
            '<p>Ya tenemos tus datos. Te contactamos muy pronto para platicar de tu proyecto.</p>' +
            '<p class="alt">¿Prisa? Escríbenos directo por <a href="https://wa.me/525651634053" target="_blank" rel="noopener">WhatsApp</a>.</p>' +
            '<p style="margin-top:20px;"><a href="../" class="back">← Volver al sitio</a></p>' +
          '</div>';
        window.scrollTo(0,0);
      } else {
        btn.disabled = false; btn.textContent = 'Solicitar cotización';
        fail('No se pudo enviar. Inténtalo de nuevo o escríbenos por WhatsApp al 5651 634 053.');
      }
    })
    .catch(function(){
      btn.disabled = false; btn.textContent = 'Solicitar cotización';
      fail('No se pudo enviar. Revisa tu conexión e inténtalo de nuevo.');
    });
  });
})();
</script>
</body>
</html>
