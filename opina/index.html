<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comparte tu opinión — Spazio Luce</title>
<meta name="description" content="Cuéntanos cómo fue tu experiencia con Spazio Luce. Tu opinión ayuda a otros clientes a decidir.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A0A0A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230A0A0A'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' font-weight='700' fill='%23C9A227' text-anchor='middle'%3ESL%3C/text%3E%3C/svg%3E">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --gold:#C9A227;--gold-bright:#E4B84A;--bg:#0A0A0A;--bg-soft:#0F0F0E;
    --surface:#151513;--text:#F4F0E6;--muted:#9A9280;--line:rgba(201,162,39,0.18);
  }
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg);color:var(--text);font-family:'Montserrat',system-ui,sans-serif;
    font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased;min-height:100vh;
    display:flex;flex-direction:column;
  }
  a{color:var(--gold);text-decoration:none}
  a:hover{color:var(--gold-bright)}
  h1{font-family:'Playfair Display',Georgia,serif;font-weight:700;line-height:1.15}
  :focus-visible{outline:2px solid var(--gold-bright);outline-offset:3px}

  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:20px clamp(18px,5vw,48px);border-bottom:1px solid var(--line);
  }
  .brand{display:flex;flex-direction:column;line-height:1}
  .brand b{font-family:'Playfair Display',serif;font-size:17px;font-weight:700;letter-spacing:.16em;color:var(--text)}
  .brand span{font-size:8px;letter-spacing:.3em;color:var(--gold);margin-top:4px;font-weight:600}
  .back{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}

  main{flex:1;display:flex;justify-content:center;padding:clamp(28px,6vw,64px) clamp(18px,5vw,48px)}
  .card{width:100%;max-width:560px}

  .eyebrow{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);font-weight:600;display:inline-flex;align-items:center;gap:12px}
  .eyebrow::before{content:"";width:24px;height:1px;background:var(--gold)}
  h1{font-size:clamp(26px,5vw,36px);margin:16px 0 12px}
  .lede{color:var(--muted);font-size:14px;margin-bottom:32px;max-width:46ch}

  form{display:grid;gap:18px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .field{display:flex;flex-direction:column;gap:7px}
  .field label{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .field label .opt{color:var(--muted);letter-spacing:.05em}
  input,select,textarea{
    background:var(--bg-soft);border:1px solid var(--line);color:var(--text);
    padding:12px 14px;font-family:inherit;font-size:14px;width:100%;
  }
  textarea{min-height:120px;resize:vertical}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}

  .stars{display:inline-flex;gap:6px}
  .stars button{background:none;border:0;padding:2px;font-size:32px;line-height:1;color:rgba(244,240,230,0.16);cursor:pointer;transition:color .15s}
  .stars button.on,.stars button:hover{color:var(--gold)}

  .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}

  button.submit{
    justify-self:start;background:var(--gold);color:#0A0A0A;border:0;
    font-family:'Montserrat',sans-serif;font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;font-weight:600;
    padding:15px 34px;cursor:pointer;transition:background .2s;
  }
  button.submit:hover{background:var(--gold-bright)}
  button.submit:disabled{opacity:.6;cursor:default}

  .privacy-note{font-size:11.5px;color:var(--muted)}
  .msg{font-size:13px;padding:12px 15px;border:1px solid var(--line)}
  .msg.err{border-color:#9a5a45;color:#dca08d}

  .done{text-align:left;padding:8px 0}
  .done .check{width:48px;height:48px;border:2px solid var(--gold);border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:24px;margin-bottom:20px}
  .done h2{font-family:'Playfair Display',serif;font-size:26px;font-weight:600;margin-bottom:10px}
  .done p{color:var(--muted);font-size:14px;margin-bottom:24px;max-width:42ch}

  footer{padding:20px clamp(18px,5vw,48px);border-top:1px solid var(--line);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}

  @media (max-width:520px){ .grid2{grid-template-columns:1fr} }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="topbar">
  <a href="/" class="brand" aria-label="Spazio Luce">
    <b>SPAZIO&nbsp;LUCE</b>
    <span>Ingeniería · Proyectos · Obras</span>
  </a>
  <a href="/" class="back">← Volver al sitio</a>
</header>

<main>
  <div class="card" id="card">
    <p class="eyebrow">Opiniones</p>
    <h1>Comparte tu opinión</h1>
    <p class="lede">Cuéntanos cómo fue trabajar con Spazio Luce. Tu reseña se publica en el sitio tras una revisión rápida.</p>

    <form id="form" novalidate>
      <div class="grid2">
        <div class="field">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" maxlength="80" required autocomplete="name">
        </div>
        <div class="field">
          <label for="telefono">Teléfono <span class="opt">(opcional)</span></label>
          <input type="tel" id="telefono" maxlength="20" autocomplete="tel" placeholder="Para identificarte con tu cotización">
        </div>
      </div>
      <div class="grid2">
        <div class="field">
          <label for="ubicacion">Colonia o ciudad <span class="opt">(opcional)</span></label>
          <input type="text" id="ubicacion" maxlength="80" autocomplete="address-level2">
        </div>
        <div class="field">
          <label for="tipo">Tipo de proyecto</label>
          <select id="tipo">
            <option value="">Selecciona…</option>
            <option>Residencial</option>
            <option>Comercial</option>
            <option>Industrial</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label for="proyecto">Proyecto <span class="opt">(opcional)</span></label>
        <input type="text" id="proyecto" maxlength="80" placeholder="Ej. Remodelación de sala">
      </div>
      <div class="field">
        <label id="starsLabel">Tu calificación</label>
        <div class="stars" id="stars" role="radiogroup" aria-labelledby="starsLabel"></div>
      </div>
      <div class="field">
        <label for="comentario">Tu experiencia</label>
        <textarea id="comentario" maxlength="1000" required placeholder="¿Cómo fue el proceso? ¿Qué te gustó del resultado? ¿Recomendarías a Spazio Luce?"></textarea>
      </div>
      <input type="text" class="hp" id="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button type="submit" class="submit" id="submit">Enviar opinión</button>
      <p class="privacy-note">Al enviar aceptas nuestro <a href="/aviso-privacidad/">Aviso de Privacidad</a>.</p>
      <p class="msg err" id="msg" hidden></p>
    </form>
  </div>
</main>

<footer>Spazio Luce · Naucalpan, Estado de México</footer>

<script>
(function(){
  "use strict";
  var SB_URL = 'https://smjktuithhvfmexysvkf.supabase.co';
  var SB_KEY = 'sb_publishable_h7YxlJXIADT1827fFx6hyg_jtjmnmGZ';
  var $ = function(id){ return document.getElementById(id); };

  var rating = 0;
  var wrap = $('stars');
  for(var i=1;i<=5;i++){
    (function(n){
      var b = document.createElement('button');
      b.type = 'button'; b.textContent = '★';
      b.setAttribute('role','radio'); b.setAttribute('aria-checked','false');
      b.setAttribute('aria-label', n + (n===1 ? ' estrella' : ' estrellas'));
      b.addEventListener('click', function(){
        rating = n;
        [].forEach.call(wrap.children, function(c, idx){
          c.classList.toggle('on', idx < n);
          c.setAttribute('aria-checked', (idx+1)===n ? 'true' : 'false');
        });
      });
      wrap.appendChild(b);
    })(i);
  }

  $('form').addEventListener('submit', function(e){
    e.preventDefault();
    var msg = $('msg'), btn = $('submit');
    var fail = function(text){ msg.textContent = text; msg.hidden = false; };
    msg.hidden = true;

    if($('hp').value) return;
    var nombre = $('nombre').value.trim();
    var comentario = $('comentario').value.trim();
    if(nombre.length < 2){ fail('Escribe tu nombre.'); $('nombre').focus(); return; }
    if(!rating){ fail('Elige una calificación de 1 a 5 estrellas.'); return; }
    if(comentario.length < 5){ fail('Cuéntanos un poco más sobre tu experiencia.'); $('comentario').focus(); return; }

    btn.disabled = true; btn.textContent = 'Enviando…';
    fetch(SB_URL + '/rest/v1/reviews', {
      method: 'POST',
      headers: { apikey: SB_KEY, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
      body: JSON.stringify({
        nombre: nombre,
        telefono: $('telefono').value.trim() || null,
        ubicacion: $('ubicacion').value.trim() || null,
        tipo: $('tipo').value || null,
        proyecto: $('proyecto').value.trim() || null,
        rating: rating,
        comentario: comentario
      })
    })
    .then(function(r){
      if(r.ok || r.status === 201){
        $('card').innerHTML =
          '<div class="done">' +
            '<div class="check" aria-hidden="true">✓</div>' +
            '<h2>¡Gracias por tu opinión!</h2>' +
            '<p>La revisamos y la publicamos en el sitio muy pronto. Agradecemos que te tomes el tiempo de compartir tu experiencia.</p>' +
            '<a href="/" class="back">← Volver al sitio</a>' +
          '</div>';
        window.scrollTo(0,0);
      } else {
        btn.disabled = false; btn.textContent = 'Enviar opinión';
        fail('No se pudo enviar. Inténtalo de nuevo o escríbenos por WhatsApp al 5651 634 053.');
      }
    })
    .catch(function(){
      btn.disabled = false; btn.textContent = 'Enviar opinión';
      fail('No se pudo enviar. Revisa tu conexión e inténtalo de nuevo.');
    });
  });
})();
</script>
</body>
</html>
